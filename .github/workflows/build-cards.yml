name: Générer les cartes (Wikidata)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre de cartes"
        default: "1000"
  push:
    paths:
      - "scripts/build-cards.mjs"
      - ".github/workflows/build-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer js/cards.js
        run: node scripts/build-cards.mjs "${{ github.event.inputs.count || '1000' }}"
      - name: Résumé
        run: cat data/build-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/cards.js data/build-report.txt
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "Cartes régénérées depuis Wikidata"
          git push
