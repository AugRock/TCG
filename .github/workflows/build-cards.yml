name: Générer les cartes (Wikidata)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre de cartes"
        default: "1000"
  push:
    paths:
      - "scripts/*.mjs"
      - ".github/workflows/build-cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Explorer le Recensement des équipements sportifs
        continue-on-error: true
        run: node scripts/probe-res.mjs
      - name: Générer js/cards.js
        run: node scripts/build-cards.mjs "${{ github.event.inputs.count || '1000' }}"
      - name: Résumé
        if: always()
        run: cat data/build-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/cards.js data/
          git diff --cached --quiet && echo "Aucun changement" && exit 0
          git commit -m "Cartes régénérées depuis Wikidata"
          git push
